<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Haider ❤️</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Georgia,serif;color:#fff;background:radial-gradient(circle at 50% 20%,#5b1028 0,#210812 42%,#080407 100%);display:grid;place-items:center;overflow:hidden}
.card{width:min(92vw,430px);padding:36px 24px;border:1px solid #a83b5e;border-radius:28px;text-align:center;background:rgba(18,5,12,.78);box-shadow:0 0 45px #b51d4b55;position:relative;z-index:2}
.heart{font-size:42px;animation:pulse 1.2s infinite}.eyebrow{letter-spacing:4px;text-transform:uppercase;color:#ff9ab6;font:12px Arial,sans-serif;margin:12px 0}
h1{font-size:clamp(34px,9vw,48px);line-height:1.1;margin:12px 0;color:#fff}p{color:#f5cbd7;line-height:1.7;font-size:17px}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
button{border:0;border-radius:999px;padding:14px 27px;font-size:17px;font-weight:bold;cursor:pointer;transition:transform .2s}
#yes{background:#ed376b;color:white;box-shadow:0 7px 20px #ed376b55}#no{background:#3b2630;color:#ffdce6}
button:active{transform:scale(.95)}#answer{min-height:64px;margin-top:22px;color:#ff9ab6;font-size:20px;line-height:1.5}
.small{font:12px Arial,sans-serif;color:#b98b9a;margin-top:20px}
.float{position:fixed;bottom:-40px;color:#ff5c8a;opacity:.5;animation:rise linear infinite;z-index:1}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <div class="eyebrow">A little question for you</div>
  <h1>Hey Haider,<br>Do You Love Me?</h1>
  <p>You make my world brighter. I have one little question, and I hope you know the answer. 🥹</p>
  <div class="buttons">
    <button id="yes" onclick="sayYes()">YES ❤️</button>
    <button id="no" onclick="sayNo()">NO 🥺</button>
  </div>
  <div id="answer" aria-live="polite"></div>
  <div class="small">Made with love, just for you 💌</div>
</div>
<script>
function sayYes(){document.getElementById('answer').innerHTML='I knew it! 🥹❤️<br>I love you more than words can say. You are my forever! 💋';}
function sayNo(){document.getElementById('answer').textContent='Are you sure, Haider? 🥺 Give me one more chance ❤️';}
for(let i=0;i<22;i++){let h=document.createElement('div');h.className='float';h.textContent=['♥','♡','❤'][i%3];h.style.left=Math.random()*100+'vw';h.style.animationDuration=(7+Math.random()*9)+'s';h.style.animationDelay=(-Math.random()*14)+'s';h.style.fontSize=(14+Math.random()*24)+'px';document.body.appendChild(h);}
</script>
</body>
</html>
