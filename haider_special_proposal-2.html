<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffb3c6">
<title>A Special Question from Haider 💗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:linear-gradient(135deg,#ffe5ec 0%,#ffb3c6 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative;padding:18px}
.heart-bg{position:fixed;font-size:24px;color:rgba(255,75,110,.4);animation:floatUp 6s linear forwards;z-index:1;bottom:-50px;pointer-events:none}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(-105vh) rotate(360deg) scale(1.5);opacity:0}}
.card{background:rgba(255,255,255,.92);padding:clamp(24px,6vw,40px);border-radius:24px;box-shadow:0 15px 35px rgba(255,75,110,.2);text-align:center;max-width:500px;width:min(100%,500px);z-index:10;border:2px solid #ff85a2;transition:all .5s ease;position:relative}
.gif-container{min-height:130px;margin-bottom:22px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.love-icon{font-size:clamp(64px,16vw,80px);animation:pulse 1.5s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
h1{color:#ff4b6e;font-size:clamp(1.55rem,6vw,2rem);margin-bottom:15px;line-height:1.3}
p{color:#666;font-size:1.05rem;margin-bottom:24px;line-height:1.5}
.btn-group{display:flex;justify-content:center;align-items:center;gap:18px;position:relative;min-height:76px}
button{padding:13px 28px;font-size:1.1rem;font-weight:bold;border:none;border-radius:50px;cursor:pointer;transition:background-color .2s,transform .2s;box-shadow:0 5px 15px rgba(0,0,0,.1);touch-action:manipulation}
#yesBtn{background:#ff4b6e;color:white;z-index:100}
#yesBtn:hover{background:#ff1f4b;box-shadow:0 8px 20px rgba(255,75,110,.4)}
#noBtn{background:#f0f0f0;color:#555;position:relative;z-index:101}
.hidden{display:none!important}.celebrate-hearts{font-size:35px;margin-top:12px}
@media(max-width:380px){.btn-group{gap:10px}button{padding:12px 23px;font-size:1rem}}
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="gif-container" id="mediaBox"><div class="love-icon">💝</div></div>
  <h1 id="headline">Will you make me the happiest person alive?</h1>
  <p id="subline">Haider has a very special question for you...</p>
  <div class="btn-group" id="actions">
    <button id="yesBtn" type="button" onclick="acceptProposal()">Yes! 💖</button>
    <button id="noBtn" type="button" onmouseenter="dodgeButton()" onclick="dodgeButton()">No 🙈</button>
  </div>
</div>
<script>
let rejectionCount=0;
const messages=["Are you sure? 🥺","Please think again! ❤️","Haider promises endless cuddles! ✨","You can't say no to this face! 🐻","Give it a chance! 🌹"];
function createHeart(){
 const heart=document.createElement('div');heart.className='heart-bg';heart.textContent=['❤️','💖','💝','💕'][Math.floor(Math.random()*4)];
 heart.style.left=Math.random()*100+'vw';heart.style.animationDuration=(Math.random()*3+3)+'s';document.body.appendChild(heart);setTimeout(()=>heart.remove(),6500);
}
setInterval(createHeart,500);
function dodgeButton(){
 const b=document.getElementById('noBtn'),yes=document.getElementById('yesBtn'),headline=document.getElementById('headline');
 const pad=12,maxX=Math.max(pad,window.innerWidth-b.offsetWidth-pad),maxY=Math.max(pad,window.innerHeight-b.offsetHeight-pad);
 b.style.position='fixed';b.style.left=(pad+Math.random()*(maxX-pad))+'px';b.style.top=(pad+Math.random()*(maxY-pad))+'px';
 if(rejectionCount<messages.length)headline.textContent=messages[rejectionCount];rejectionCount++;
 const scale=Math.min(2.1,1+rejectionCount*.12);yes.style.transform=`scale(${scale})`;
}
function acceptProposal(){
 document.getElementById('mediaBox').innerHTML='<div class="love-icon">👩‍❤️‍👨</div><div class="celebrate-hearts">🎉✨❤️</div>';
 document.getElementById('headline').textContent="I knew you'd say YES! 🥰";
 document.getElementById('subline').textContent="Forever yours, Haider. 💗";
 document.getElementById('actions').classList.add('hidden');
 for(let i=0;i<30;i++)setTimeout(createHeart,i*100);
}
</script>
</body>
</html>
